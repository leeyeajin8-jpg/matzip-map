<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>인증맛집 지도 MVP</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;background:#f7f7f7;color:#171717}
.app{max-width:480px;margin:auto;min-height:100vh;background:#fff}.top{position:sticky;top:0;background:#fff;z-index:5;padding:14px 14px 10px;border-bottom:1px solid #eee}
.search{width:100%;padding:13px 15px;border:1px solid #ddd;border-radius:14px;font-size:15px}.filters{display:flex;gap:7px;margin-top:9px;overflow:auto}
button{border:1px solid #ddd;background:#fff;border-radius:999px;padding:9px 12px;font-weight:650;white-space:nowrap}.active{background:#111;color:#fff}
.map{height:55vh;position:relative;overflow:hidden;background:linear-gradient(25deg,#e8f1e5,#eef3f8)}
.road{position:absolute;background:#fff9;border-radius:99px;transform:rotate(-18deg);width:130%;height:12px;left:-20%;top:42%}.river{position:absolute;width:130%;height:65px;background:#cfe8f6;left:-15%;top:58%;transform:rotate(-6deg)}
.pin{position:absolute;width:38px;height:38px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#222;display:grid;place-items:center;box-shadow:0 3px 9px #0003}
.pin span{transform:rotate(45deg);color:#fff;font-size:12px}.multi{background:#f59e0b}.cluster{border-radius:50%;transform:none;background:#1473e6}.cluster span{transform:none}
.research{position:absolute;top:12px;left:50%;transform:translateX(-50%);box-shadow:0 2px 8px #0002}.loc{position:absolute;right:12px;bottom:14px}.sheet{padding:16px 16px 90px}.title{font-size:23px;font-weight:800}.meta{color:#666;margin:6px 0}.tags{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.tag{font-size:12px;padding:5px 8px;border-radius:8px;background:#eef4ff;color:#2457a6}
.menu{border-top:1px solid #eee;margin-top:14px}.row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #eee}.naver{width:100%;margin-top:16px;border:0;border-radius:12px;background:#03c75a;color:#fff;padding:14px}
.list{display:none;padding:12px 14px 90px}.card{padding:15px 4px;border-bottom:1px solid #eee}.card h3{margin:0 0 5px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:480px;width:100%;display:flex;background:#fff;border-top:1px solid #ddd;padding-bottom:env(safe-area-inset-bottom)}
.bottom button{width:50%;border:0;border-radius:0;padding:16px}.note{font-size:12px;color:#9a5a00;background:#fff7df;padding:8px;border-radius:8px;margin-top:10px}
</style></head>
<body><div class="app">
<div class="top"><input id="q" class="search" placeholder="맛집이나 메뉴를 검색해보세요"><div class="filters">
<button data-cat="all" class="active">전체</button><button data-cat="한식">한식</button><button data-cat="고기">고기</button><button data-cat="일식">일식</button><button data-cat="중식">중식</button><button data-cat="양식">양식</button><button id="multi">복수 인증</button>
</div></div>
<section id="mapView"><div class="map"><div class="road"></div><div class="river"></div>
<button class="research" onclick="render()">↻ 현 지도에서 재검색</button>
<div class="pin multi" style="left:23%;top:22%" onclick="selectR(0)"><span>★</span></div>
<div class="pin" style="left:48%;top:34%" onclick="selectR(1)"><span>맛</span></div>
<div class="pin cluster" style="left:67%;top:18%"><span>5</span></div>
<div class="pin" style="left:60%;top:67%" onclick="selectR(4)"><span>맛</span></div>
<button class="loc">◎ 내 위치</button></div><div id="sheet" class="sheet"></div></section>
<section id="listView" class="list"><h2>맛집 목록</h2><div id="count"></div><div id="cards"></div><h3 style="margin-top:26px">우선 수집 후보</h3><div id="candidateCards"></div></section>
<nav class="bottom"><button id="mapTab" class="active" onclick="tab('map')">지도</button><button id="listTab" onclick="tab('list')">목록</button></nav>
</div>
<script>
const CANDIDATES = [{"name": "상도실내포장마차", "district": "동작구", "cats": ["한식", "해산물"], "sources": ["수요미식회"], "menus": ["오징어통찜", "오징어물회"], "note": "동작구 우선 후보"}, {"name": "사이공리", "district": "동작구", "cats": ["기타"], "sources": ["수요미식회"], "menus": ["쌀국수"], "note": "동작구 우선 후보"}, {"name": "서일순대국", "district": "동작구", "cats": ["한식"], "sources": ["수요미식회"], "menus": ["순대국"], "note": "동작구 우선 후보"}, {"name": "애플하우스", "district": "동작구 인접", "cats": ["분식"], "sources": ["수요미식회", "최자로드"], "menus": ["즉석떡볶이", "무침군만두"], "note": "복수 인증 우선 후보"}, {"name": "화목순대국", "district": "영등포구", "cats": ["한식"], "sources": ["먹을텐데"], "menus": ["순대국", "내장탕"], "note": "영등포 우선 후보"}, {"name": "대한옥", "district": "영등포구", "cats": ["한식", "고기"], "sources": ["최자로드"], "menus": ["꼬리수육", "설렁탕"], "note": "영등포 우선 후보"}, {"name": "줘마양다리구이", "district": "영등포구", "cats": ["중식", "고기"], "sources": ["최자로드"], "menus": ["양다리구이"], "note": "영등포 우선 후보"}, {"name": "정인면옥 본점", "district": "영등포구", "cats": ["한식", "면"], "sources": ["수요미식회"], "menus": ["평양냉면"], "note": "영등포 우선 후보"}, {"name": "진주집", "district": "영등포구", "cats": ["한식", "면"], "sources": ["최자로드"], "menus": ["콩국수", "닭칼국수"], "note": "영등포 우선 후보"}, {"name": "은행골 여의도점", "district": "영등포구", "cats": ["일식"], "sources": ["수요미식회"], "menus": ["초밥"], "note": "영등포 후보"}, {"name": "갓포아키 여의도점", "district": "영등포구", "cats": ["일식"], "sources": ["수요미식회", "흑백요리사"], "menus": ["일식 코스"], "note": "복수 인증 후보"}, {"name": "진미식당", "district": "용산구", "cats": ["한식", "면"], "sources": ["먹을텐데"], "menus": ["콩국수", "오징어볶음"], "note": "용산 우선 후보"}, {"name": "까치네", "district": "용산구", "cats": ["한식", "해산물"], "sources": ["먹을텐데", "최자로드"], "menus": ["오징어볶음", "계란범벅"], "note": "복수 인증 우선 후보"}, {"name": "초원", "district": "용산구", "cats": ["고기"], "sources": ["먹을텐데"], "menus": ["한우 우설"], "note": "용산 우선 후보"}, {"name": "구복만두", "district": "용산구", "cats": ["중식"], "sources": ["수요미식회"], "menus": ["만두", "샤오롱바오"], "note": "용산 우선 후보"}, {"name": "자리", "district": "용산구", "cats": ["중식"], "sources": ["수요미식회"], "menus": ["짬뽕", "목화솜탕수육"], "note": "용산 후보"}, {"name": "이태원양꼬치", "district": "용산구", "cats": ["중식", "고기"], "sources": ["수요미식회"], "menus": ["양꼬치", "꿔바로우"], "note": "용산 후보"}, {"name": "아티장베이커스 한남", "district": "용산구", "cats": ["카페·디저트"], "sources": ["수요미식회"], "menus": ["크루아상", "빵"], "note": "용산 후보"}, {"name": "갯마을 한강로점", "district": "용산구", "cats": ["한식"], "sources": ["수요미식회"], "menus": ["만두국", "떡만두국"], "note": "용산 후보"}, {"name": "강가네맷돌빈대떡", "district": "용산구", "cats": ["한식"], "sources": ["수요미식회"], "menus": ["왕새우전", "빈대떡"], "note": "용산 후보"}, {"name": "두에 꼬제", "district": "용산구", "cats": ["양식"], "sources": ["수요미식회"], "menus": ["파스타", "화덕피자"], "note": "용산 후보"}, {"name": "지노스뉴욕피자", "district": "용산구", "cats": ["양식"], "sources": ["수요미식회"], "menus": ["피자"], "note": "용산 후보"}, {"name": "네키드윙즈", "district": "용산구", "cats": ["양식"], "sources": ["수요미식회"], "menus": ["버팔로윙"], "note": "용산 후보"}, {"name": "부자피자 1호점", "district": "용산구", "cats": ["양식"], "sources": ["수요미식회"], "menus": ["화덕피자"], "note": "용산 후보"}, {"name": "모터시티바이매니멀", "district": "용산구", "cats": ["양식"], "sources": ["수요미식회"], "menus": ["디트로이트피자", "파스타"], "note": "용산 후보"}, {"name": "평양집", "district": "용산구", "cats": ["한식"], "sources": ["수요미식회"], "menus": ["내장탕", "해장국"], "note": "용산 후보"}, {"name": "땅끝마을매생이굴국밥", "district": "용산구", "cats": ["한식", "해산물"], "sources": ["맛있는 녀석들"], "menus": ["매생이굴국밥"], "note": "용산 후보"}];
const R = [{"id": 1, "name": "진미순대", "district": "동작구", "lat": 37.5072, "lng": 126.9617, "cats": ["한식"], "sources": ["먹을텐데"], "naver": 4.3, "kakao": 4.2, "menu": [["순대국밥", "10,000원"], ["막창", "18,000원"], ["머리고기", "18,000원"]], "desc": "흑석시장에 자리한 순대 전문 노포. 먹을텐데 소개 후보로 우선 검증한 샘플입니다.", "status": "평점 재검증 필요"}, {"id": 2, "name": "운봉산장", "district": "동작구", "lat": 37.5057, "lng": 126.9394, "cats": ["고기", "한식"], "sources": ["기타 유명맛집"], "naver": 4.4, "kakao": 4.3, "menu": [["양고기", "가격 확인"], ["수육", "가격 확인"]], "desc": "장승배기 일대에서 오래 알려진 양고기 전문점.", "status": "출처·평점 재검증 필요"}, {"id": 3, "name": "또순이네", "district": "영등포구", "lat": 37.5353, "lng": 126.8977, "cats": ["고기", "한식"], "sources": ["기타 유명맛집"], "naver": 4.2, "kakao": 4.2, "menu": [["된장찌개", "가격 확인"], ["토시살", "가격 확인"]], "desc": "선유도·당산권의 대표적인 고기와 된장찌개 맛집.", "status": "출처·평점 재검증 필요"}, {"id": 4, "name": "송죽장", "district": "영등포구", "lat": 37.5175, "lng": 126.9078, "cats": ["중식"], "sources": ["기타 유명맛집"], "naver": 4.2, "kakao": 4.1, "menu": [["고추짬뽕", "가격 확인"], ["짜장면", "가격 확인"], ["탕수육", "가격 확인"]], "desc": "영등포역 인근에서 오랫동안 영업해 온 중식 노포.", "status": "평점 재검증 필요"}, {"id": 5, "name": "텐동 요츠야", "district": "관악구", "lat": 37.48, "lng": 126.9527, "cats": ["일식"], "sources": ["기타 유명맛집"], "naver": 4.4, "kakao": 4.3, "menu": [["텐동", "가격 확인"], ["스페셜텐동", "가격 확인"]], "desc": "샤로수길에서 텐동으로 널리 알려진 식당.", "status": "출처·평점 재검증 필요"}, {"id": 6, "name": "쌤쌤쌤", "district": "용산구", "lat": 37.531, "lng": 126.9705, "cats": ["양식"], "sources": ["기타 유명맛집"], "naver": 4.7, "kakao": 4.4, "menu": [["파스타", "가격 확인"], ["라자냐", "가격 확인"]], "desc": "용리단길에서 미국식 캐주얼 다이닝으로 알려진 곳.", "status": "출처·평점 재검증 필요"}, {"id": 7, "name": "소울다이닝", "district": "용산구", "lat": 37.5458, "lng": 126.9851, "cats": ["한식", "양식"], "sources": ["흑백요리사"], "naver": 4.7, "kakao": 4.4, "menu": [["코스요리", "가격 확인"]], "desc": "해방촌의 컨템퍼러리 다이닝. 셰프·출처 연결성을 별도 검증하는 샘플입니다.", "status": "출처·평점 재검증 필요"}];
let cat='all', multi=false, selected=0;
function filtered(){let q=document.querySelector('#q').value.trim().toLowerCase();return R.filter(r=>(cat==='all'||r.cats.includes(cat))&&(!multi||r.sources.length>=2)&&(!q||r.name.toLowerCase().includes(q)||r.menu.some(m=>m[0].toLowerCase().includes(q))))}
function selectR(i){selected=i; drawSheet(R[i])}
function drawSheet(r){document.querySelector('#sheet').innerHTML=`<div class="title">${r.name}</div><div class="meta">${r.district} · ${r.cats.join(' · ')}　⭐ ${r.naver} / ${r.kakao}</div><div class="tags">${r.sources.map(x=>`<span class="tag">${x}</span>`).join('')}</div><p>${r.desc}</p><div class="menu">${r.menu.map(m=>`<div class="row"><b>${m[0]}</b><span>${m[1]}</span></div>`).join('')}</div><div class="note">프로토타입 데이터: 네이버·카카오 4.0+ 및 인증 출처는 본 데이터 수집 시 개별 검증 후 확정</div><button class="naver" onclick="window.open('https://map.naver.com/p/search/'+encodeURIComponent(r.name),'_blank')">네이버지도에서 보기</button>`}
function drawCandidates(){
 let c=CANDIDATES.filter(x=>!document.querySelector('#q').value.trim()||x.name.includes(document.querySelector('#q').value.trim())||x.menus.some(m=>m.includes(document.querySelector('#q').value.trim())));
 document.querySelector('#candidateCards').innerHTML=c.map(x=>`<div class="card"><h3>${x.name}</h3><div class="meta">${x.district} · ${x.cats.join(' · ')}</div><div class="tags">${x.sources.map(s=>`<span class="tag">${s}</span>`).join('')}</div><small>${x.menus.join(' · ')}</small><div class="note">${x.note} · 네이버/카카오 4.0+ 개별 검증 전 후보</div></div>`).join('');
}
function render(){drawCandidates();let a=filtered();document.querySelector('#count').textContent=`검색 결과 ${a.length}개`;document.querySelector('#cards').innerHTML=a.map((r,i)=>`<div class="card" onclick="drawSheet(R[${R.indexOf(r)}]);tab('map')"><h3>${r.name}</h3><div class="meta">${r.district} · ${r.cats.join(' · ')} · ⭐ ${r.naver} / ${r.kakao}</div><div class="tags">${r.sources.map(x=>`<span class="tag">${x}</span>`).join('')}</div><small>${r.menu.map(m=>m[0]).join(' · ')}</small></div>`).join('')}
function tab(x){document.querySelector('#mapView').style.display=x==='map'?'block':'none';document.querySelector('#listView').style.display=x==='list'?'block':'none';mapTab.classList.toggle('active',x==='map');listTab.classList.toggle('active',x==='list');render()}
document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-cat]').forEach(x=>x.classList.remove('active'));b.classList.add('active');cat=b.dataset.cat;render()})
multi.onclick=()=>{multi=!multi;document.querySelector('#multi').classList.toggle('active',multi);render()}
q.oninput=render; drawSheet(R[0]);render();
</script></body></html>
