<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>인증맛집 지도 MVP</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;background:#f5f5f5;color:#171717}
    button,input{font:inherit}
    button{cursor:pointer}
    .app{max-width:520px;margin:0 auto;min-height:100vh;background:#fff;position:relative}
    .top{position:sticky;top:0;background:#fff;z-index:30;padding:14px 14px 10px;border-bottom:1px solid #eee}
    .search{width:100%;padding:13px 15px;border:1px solid #ddd;border-radius:14px;font-size:15px;outline:none;background:#fff}
    .search:focus{border-color:#222}
    .filters{display:flex;gap:7px;margin-top:9px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
    .filters::-webkit-scrollbar{display:none}
    .chip{border:1px solid #ddd;background:#fff;border-radius:999px;padding:9px 12px;font-weight:700;white-space:nowrap}
    .chip.active{background:#111;color:#fff;border-color:#111}
    .mapWrap{height:56vh;min-height:390px;position:relative;background:#eef2f5}
    #map{width:100%;height:100%}
    .mapBtn{position:absolute;z-index:10;border:1px solid #ddd;background:#fff;border-radius:999px;font-weight:750;box-shadow:0 2px 10px #0002}
    .research{top:12px;left:50%;transform:translateX(-50%);padding:10px 14px}
    .loc{right:12px;bottom:14px;width:46px;height:46px;padding:0;font-size:20px}
    .mapError{display:none;position:absolute;inset:0;z-index:20;background:#fff;align-items:center;justify-content:center;text-align:center;padding:30px;line-height:1.55}
    .sheet{padding:18px 16px 92px;background:#fff}
    .emptySheet{padding:24px 0;color:#777;text-align:center}
    .title{font-size:23px;font-weight:850}
    .meta{color:#666;margin:7px 0;font-size:14px}
    .ratings{display:flex;gap:8px;margin:9px 0}
    .rating{font-size:13px;padding:6px 9px;border-radius:8px;background:#f5f5f5}
    .tags{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
    .tag{font-size:12px;padding:5px 8px;border-radius:8px;background:#eef4ff;color:#2457a6;font-weight:650}
    .desc{line-height:1.55;margin:13px 0}
    .menu{border-top:1px solid #eee;margin-top:14px}
    .row{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid #eee}
    .row span:last-child{white-space:nowrap;color:#444}
    .naver{width:100%;margin-top:16px;border:0;border-radius:12px;background:#03c75a;color:#fff;padding:14px;font-weight:800}
    .note{font-size:12px;color:#8b5b00;background:#fff7df;padding:9px 10px;border-radius:8px;margin-top:12px;line-height:1.45}
    .list{display:none;padding:14px 14px 92px}
    .listHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
    .listHead h2{margin:0}
    .count{color:#777;font-size:14px}
    .card{padding:15px 3px;border-bottom:1px solid #eee}
    .card h3{margin:0 0 5px;font-size:18px}
    .card small{color:#555;line-height:1.5}
    .candidateTitle{margin:28px 0 6px}
    .bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:520px;width:100%;display:flex;background:#fff;border-top:1px solid #ddd;padding-bottom:env(safe-area-inset-bottom);z-index:40}
    .bottom button{width:50%;border:0;border-radius:0;padding:16px;background:#fff;font-weight:800}
    .bottom button.active{color:#111;background:#f2f2f2}
    .marker{display:flex;align-items:center;justify-content:center;min-width:34px;height:34px;padding:0 9px;border-radius:17px;background:#171717;color:#fff;border:2px solid #fff;box-shadow:0 2px 8px #0004;font-size:12px;font-weight:850;white-space:nowrap}
    .marker.multi{background:#f59e0b}
    .meMarker{width:20px;height:20px;border-radius:50%;background:#2f80ed;border:4px solid #fff;box-shadow:0 1px 7px #0005}
    @media (min-width:521px){body{padding:20px 0}.app{min-height:calc(100vh - 40px);box-shadow:0 0 30px #0001}.bottom{bottom:20px}}
  </style>
</head>
<body>
<div class="app">
  <div class="top">
    <input id="q" class="search" placeholder="맛집이나 메뉴를 검색해보세요">
    <div class="filters">
      <button class="chip active" data-cat="all">전체</button>
      <button class="chip" data-cat="한식">한식</button>
      <button class="chip" data-cat="고기">고기</button>
      <button class="chip" data-cat="일식">일식</button>
      <button class="chip" data-cat="중식">중식</button>
      <button class="chip" data-cat="양식">양식</button>
      <button class="chip" data-cat="면">면</button>
      <button class="chip" data-cat="해산물">해산물</button>
      <button class="chip" data-cat="분식">분식</button>
      <button class="chip" data-cat="카페·디저트">카페·디저트</button>
      <button id="multi" class="chip">복수 인증</button>
    </div>
  </div>

  <section id="mapView">
    <div class="mapWrap">
      <div id="map"></div>
      <button id="research" class="mapBtn research">↻ 현 지도에서 재검색</button>
      <button id="loc" class="mapBtn loc" aria-label="내 위치">◎</button>
      <div id="mapError" class="mapError">
        <div><b>네이버 지도를 불러오지 못했습니다.</b><br>잠시 후 새로고침하거나 NAVER Cloud의 Web Service URL / Dynamic Map 설정을 확인해 주세요.</div>
      </div>
    </div>
    <div id="sheet" class="sheet"><div class="emptySheet">맛집 정보를 불러오는 중...</div></div>
  </section>

  <section id="listView" class="list">
    <div class="listHead"><h2>맛집 목록</h2><div id="count" class="count"></div></div>
    <div id="cards"></div>
    <h3 class="candidateTitle">우선 수집 후보</h3>
    <div id="candidateCards"></div>
  </section>

  <nav class="bottom">
    <button id="mapTab" class="active">지도</button>
    <button id="listTab">목록</button>
  </nav>
</div>

<script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=0piujoi9ef"></script>
<script>
(function(){
  var R = [];
  var CANDIDATES = [];
  var cat = "all";
  var multiOnly = false;
  var boundsOnly = false;
  var map = null;
  var markers = [];
  var meMarker = null;

  function esc(v){
    return String(v == null ? "" : v)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#039;");
  }

  function query(){
    return document.getElementById("q").value.trim().toLowerCase();
  }

  function baseFiltered(){
    var term = query();
    return R.filter(function(r){
      var catOk = cat === "all" || (r.cats || []).indexOf(cat) >= 0;
      var multiOk = !multiOnly || (r.sources || []).length >= 2;
      var textOk = !term ||
        String(r.name || "").toLowerCase().indexOf(term) >= 0 ||
        (r.menu || []).some(function(m){ return String(m[0] || "").toLowerCase().indexOf(term) >= 0; });
      return catOk && multiOk && textOk;
    });
  }

  function filteredForMap(){
    var rows = baseFiltered();
    if(!boundsOnly || !map) return rows;
    var b = map.getBounds();
    return rows.filter(function(r){
      return b.hasLatLng(new naver.maps.LatLng(r.lat, r.lng));
    });
  }

  function clearMarkers(){
    markers.forEach(function(m){ m.setMap(null); });
    markers = [];
  }

  function markerHtml(r){
    var isMulti = (r.sources || []).length >= 2;
    return '<div class="marker' + (isMulti ? ' multi' : '') + '">' + (isMulti ? '★ ' : '') + esc(r.name) + '</div>';
  }

  function drawMarkers(){
    if(!map || !window.naver || !naver.maps) return;
    clearMarkers();
    var rows = filteredForMap();
    rows.forEach(function(r){
      var marker = new naver.maps.Marker({
        position: new naver.maps.LatLng(r.lat, r.lng),
        map: map,
        title: r.name,
        icon: {
          content: markerHtml(r),
          anchor: new naver.maps.Point(18, 34)
        }
      });
      naver.maps.Event.addListener(marker, "click", function(){
        drawSheet(r);
        map.panTo(marker.getPosition());
      });
      markers.push(marker);
    });
  }

  function drawSheet(r){
    var el = document.getElementById("sheet");
    if(!r){
      el.innerHTML = '<div class="emptySheet">조건에 맞는 맛집이 없습니다.</div>';
      return;
    }
    var menus = (r.menu || []).map(function(m){
      return '<div class="row"><b>' + esc(m[0]) + '</b><span>' + esc(m[1]) + '</span></div>';
    }).join("");
    var tags = (r.sources || []).map(function(s){
      return '<span class="tag">' + esc(s) + '</span>';
    }).join("");
    el.innerHTML =
      '<div class="title">' + esc(r.name) + '</div>' +
      '<div class="meta">' + esc(r.district) + ' · ' + esc((r.cats || []).join(" · ")) + '</div>' +
      '<div class="ratings"><span class="rating">네이버 ⭐ ' + esc(r.naver) + '</span><span class="rating">카카오 ⭐ ' + esc(r.kakao) + '</span></div>' +
      '<div class="tags">' + tags + '</div>' +
      '<p class="desc">' + esc(r.desc) + '</p>' +
      '<div class="menu">' + menus + '</div>' +
      '<div class="note">프로토타입 데이터입니다. 네이버·카카오 평점과 인증 출처는 본 데이터 수집 단계에서 개별 검증 후 확정합니다.</div>' +
      '<button id="naverOpen" class="naver">네이버지도에서 보기</button>';
    document.getElementById("naverOpen").onclick = function(){
      window.open("https://map.naver.com/p/search/" + encodeURIComponent(r.name), "_blank");
    };
  }

  function drawCandidates(){
    var term = query();
    var rows = CANDIDATES.filter(function(x){
      if(!term) return true;
      return String(x.name || "").toLowerCase().indexOf(term) >= 0 ||
        (x.menus || []).some(function(m){ return String(m).toLowerCase().indexOf(term) >= 0; });
    });
    document.getElementById("candidateCards").innerHTML = rows.map(function(x){
      var tags = (x.sources || []).map(function(s){ return '<span class="tag">' + esc(s) + '</span>'; }).join("");
      return '<div class="card"><h3>' + esc(x.name) + '</h3>' +
        '<div class="meta">' + esc(x.district) + ' · ' + esc((x.cats || []).join(" · ")) + '</div>' +
        '<div class="tags">' + tags + '</div>' +
        '<small>' + esc((x.menus || []).join(" · ")) + '</small>' +
        '<div class="note">' + esc(x.note) + ' · 네이버/카카오 4.0+ 개별 검증 전 후보</div></div>';
    }).join("");
  }

  function renderList(){
    var rows = baseFiltered();
    document.getElementById("count").textContent = "검색 결과 " + rows.length + "개";
    document.getElementById("cards").innerHTML = rows.map(function(r){
      var tags = (r.sources || []).map(function(s){ return '<span class="tag">' + esc(s) + '</span>'; }).join("");
      var idx = R.indexOf(r);
      return '<div class="card" data-idx="' + idx + '"><h3>' + esc(r.name) + '</h3>' +
        '<div class="meta">' + esc(r.district) + ' · ' + esc((r.cats || []).join(" · ")) + ' · 네이버 ' + esc(r.naver) + ' / 카카오 ' + esc(r.kakao) + '</div>' +
        '<div class="tags">' + tags + '</div>' +
        '<small>' + esc((r.menu || []).map(function(m){ return m[0]; }).join(" · ")) + '</small></div>';
    }).join("");
    Array.prototype.forEach.call(document.querySelectorAll(".card[data-idx]"), function(card){
      card.onclick = function(){
        var r = R[Number(card.getAttribute("data-idx"))];
        showTab("map");
        drawSheet(r);
        if(map){
          map.panTo(new naver.maps.LatLng(r.lat, r.lng));
          map.setZoom(15);
        }
      };
    });
  }

  function render(){
    drawCandidates();
    renderList();
    drawMarkers();
    var rows = filteredForMap();
    drawSheet(rows[0] || null);
  }

  function showTab(which){
    var isMap = which === "map";
    document.getElementById("mapView").style.display = isMap ? "block" : "none";
    document.getElementById("listView").style.display = isMap ? "none" : "block";
    document.getElementById("mapTab").classList.toggle("active", isMap);
    document.getElementById("listTab").classList.toggle("active", !isMap);
    if(isMap && map){
      setTimeout(function(){ naver.maps.Event.trigger(map, "resize"); }, 0);
    }
  }

  function locateMe(){
    if(!navigator.geolocation){
      alert("이 브라우저에서는 현재 위치를 사용할 수 없습니다.");
      return;
    }
    navigator.geolocation.getCurrentPosition(function(pos){
      var here = new naver.maps.LatLng(pos.coords.latitude, pos.coords.longitude);
      map.setCenter(here);
      map.setZoom(15);
      if(meMarker) meMarker.setMap(null);
      meMarker = new naver.maps.Marker({
        position: here,
        map: map,
        zIndex: 100,
        icon: {
          content: '<div class="meMarker"></div>',
          anchor: new naver.maps.Point(10,10)
        }
      });
    }, function(){
      alert("현재 위치 권한을 허용하면 내 위치로 이동할 수 있습니다.");
    }, {enableHighAccuracy:true, timeout:8000, maximumAge:30000});
  }

  function initMap(){
    if(!window.naver || !naver.maps){
      document.getElementById("mapError").style.display = "flex";
      return;
    }
    map = new naver.maps.Map("map", {
      center: new naver.maps.LatLng(37.5666103, 126.9783882),
      zoom: 11,
      minZoom: 7,
      zoomControl: false
    });
  }

  window.navermap_authFailure = function(){
    document.getElementById("mapError").style.display = "flex";
  };

  initMap();

  Promise.all([
    fetch("./data.json", {cache:"no-store"}).then(function(r){ if(!r.ok) throw new Error("data"); return r.json(); }),
    fetch("./candidates_priority.json", {cache:"no-store"}).then(function(r){ if(!r.ok) throw new Error("candidate"); return r.json(); })
  ]).then(function(values){
    R = values[0];
    CANDIDATES = values[1];
    render();
    locateMe();
  }).catch(function(){
    document.getElementById("sheet").innerHTML = '<div class="emptySheet">맛집 데이터를 불러오지 못했습니다. 잠시 후 새로고침해 주세요.</div>';
  });

  Array.prototype.forEach.call(document.querySelectorAll("[data-cat]"), function(btn){
    btn.onclick = function(){
      Array.prototype.forEach.call(document.querySelectorAll("[data-cat]"), function(b){ b.classList.remove("active"); });
      btn.classList.add("active");
      cat = btn.getAttribute("data-cat");
      boundsOnly = false;
      render();
    };
  });

  document.getElementById("multi").onclick = function(){
    multiOnly = !multiOnly;
    this.classList.toggle("active", multiOnly);
    boundsOnly = false;
    render();
  };

  document.getElementById("q").oninput = function(){
    boundsOnly = false;
    render();
  };

  document.getElementById("research").onclick = function(){
    boundsOnly = true;
    render();
  };

  document.getElementById("loc").onclick = locateMe;
  document.getElementById("mapTab").onclick = function(){ showTab("map"); };
  document.getElementById("listTab").onclick = function(){ showTab("list"); };
})();
</script>
</body>
</html>
