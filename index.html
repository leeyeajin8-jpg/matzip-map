<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="성시경 먹을텐데·또간집·백종원·수요미식회 등 방송이 인증하고 네이버·카카오 평점 4.0 이상인 수도권 맛집 지도">
  <title>인증맛집 지도</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
    :root{
      --bg:#f4f5f7;
      --surface:#ffffff;
      --surface-2:#f4f5f7;
      --surface-3:#eceef1;
      --text:#17191c;
      --text-2:#4a4f56;
      --muted:#80858c;
      --line:#e9ebee;
      --accent:#ff5a1f;
      --accent-strong:#e8480f;
      --accent-soft:#fff1eb;
      --gold:#f5a400;
      --star:#ffb400;
      --naver:#03c75a;
      --kakao:#fee500;
      --radius-sm:10px;
      --radius-md:14px;
      --radius-lg:20px;
      --shadow-sm:0 2px 8px rgba(18,24,40,.08);
      --shadow-md:0 6px 20px rgba(18,24,40,.12);
      --shadow-lg:0 18px 50px rgba(18,24,40,.2);
      --nav-h:60px;
      --panel-w:420px;
      --ease:cubic-bezier(.2,.8,.2,1);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;height:100%;font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
    body{overscroll-behavior:none;overflow:hidden}
    button,input{font:inherit;color:inherit}
    button{cursor:pointer;background:none;border:0;padding:0}
    a{color:inherit;text-decoration:none}
    :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    .ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .ic.fill{fill:currentColor;stroke:none}
    .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

    /* ---------- shell ---------- */
    .app{height:100dvh;display:flex;flex-direction:column;background:var(--surface);position:relative}
    .top{flex:none;z-index:40;background:var(--surface);padding:calc(10px + env(safe-area-inset-top)) 14px 0;border-bottom:1px solid var(--line)}
    .brandRow{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
    .brand{display:flex;align-items:center;gap:8px;font-size:19px;font-weight:800;letter-spacing:-.5px}
    .logo{width:28px;height:28px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:15px}
    .brandSub{font-size:12px;color:var(--muted);font-weight:600}
    .brandSub b{color:var(--text-2);font-weight:700}

    .searchRow{display:flex;gap:8px;position:relative}
    .searchBox{position:relative;flex:1;min-width:0}
    .searchBox .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);width:18px;height:18px;pointer-events:none}
    .search{width:100%;height:44px;padding:0 40px 0 38px;border:1px solid transparent;border-radius:12px;font-size:15px;outline:none;background:var(--surface-2);transition:border-color .15s,background .15s}
    .search::placeholder{color:#9a9fa6}
    .search:focus{border-color:var(--text);background:#fff}
    .search::-webkit-search-cancel-button{display:none}
    .clearQ{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;display:none;place-items:center;color:var(--muted)}
    .clearQ .ic{position:static;transform:none;width:16px;height:16px}
    .searchBox.has .clearQ{display:grid}
    .filterBtn{position:relative;height:44px;width:44px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;color:var(--text-2);flex:none}
    .filterBtn.active{background:var(--text);color:#fff}
    .badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:999px;background:var(--accent);color:#fff;font-size:11px;font-weight:800;display:none;align-items:center;justify-content:center;padding:0 5px;border:2px solid #fff}
    .filterBtn.active .badge{display:flex}

    .suggest{position:absolute;left:0;right:0;top:50px;background:#fff;border-radius:16px;box-shadow:var(--shadow-lg);border:1px solid var(--line);z-index:70;padding:6px 0;display:none;max-height:min(60dvh,440px);overflow:auto}
    .suggest.show{display:block}
    .sgHead{display:flex;justify-content:space-between;align-items:center;padding:10px 16px 6px;font-size:12px;font-weight:700;color:var(--muted)}
    .sgHead button{font-size:12px;color:var(--muted);font-weight:600}
    .sgChips{display:flex;flex-wrap:wrap;gap:6px;padding:4px 16px 10px}
    .sgChip{display:inline-flex;align-items:center;gap:4px;padding:7px 11px;border-radius:999px;background:var(--surface-2);font-size:13px;font-weight:600;color:var(--text-2)}
    .sgChip .x{color:var(--muted);display:inline-grid;place-items:center}
    .sgChip .x .ic{width:13px;height:13px}
    .sgItem{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 16px}
    .sgItem:hover,.sgItem.kb{background:var(--surface-2)}
    .sgIcon{width:34px;height:34px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-size:17px;flex:none;color:var(--muted)}
    .sgItem b{display:block;font-size:14px;font-weight:700}
    .sgItem b mark{background:none;color:var(--accent)}
    .sgItem small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
    .sgEmpty{padding:14px 16px;color:var(--muted);font-size:13px}

    .catBar{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:10px 14px 10px;margin:0 -14px}
    .catBar::-webkit-scrollbar{display:none}
    .cat{flex:none;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600;color:var(--text-2);display:inline-flex;align-items:center;gap:5px;white-space:nowrap;transition:background .15s,color .15s,border-color .15s}
    .cat .n{font-size:11px;color:var(--muted);font-weight:600}
    .cat.on{background:var(--text);border-color:var(--text);color:#fff}
    .cat.on .n{color:#ffffffa8}
    .cat.chip{background:var(--accent-soft);border-color:transparent;color:var(--accent-strong)}
    .cat.chip .ic{width:14px;height:14px}
    .catSep{flex:none;width:1px;background:var(--line);margin:6px 2px}

    .main{flex:1;min-height:0;position:relative;display:flex}
    .pane{position:absolute;inset:0;display:none;background:var(--surface)}
    .pane.show{display:block}

    /* ---------- map ---------- */
    .mapPane{background:#eef1f5;isolation:isolate}
    #map{width:100%;height:100%}
    .fab{position:absolute;z-index:12;background:#fff;border-radius:999px;box-shadow:var(--shadow-md);display:grid;place-items:center;color:var(--text)}
    .locBtn{right:14px;bottom:18px;width:46px;height:46px;transition:bottom .25s var(--ease)}
    .locBtn.busy .ic{animation:spin 1s linear infinite}
    .locBtn.on{color:#2f80ed}
    @keyframes spin{to{transform:rotate(360deg)}}
    .listFab{left:50%;bottom:18px;transform:translateX(-50%);padding:0 16px;height:40px;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;white-space:nowrap;transition:bottom .25s var(--ease),opacity .2s}
    .listFab .ic{width:16px;height:16px}
    .listFab b{color:var(--accent)}
    .mapPane.peek .locBtn,.mapPane.peek .listFab{bottom:170px}
    .mapPane.peek .listFab{opacity:0;pointer-events:none}
    .mapError{display:none;position:absolute;inset:0;z-index:20;background:#fff;align-items:center;justify-content:center;text-align:center;padding:30px;line-height:1.6;color:var(--text-2);font-size:14px}
    .mapError b{display:block;color:var(--text);font-size:16px;margin-bottom:6px}
    .mapError button{margin-top:14px;padding:10px 16px;border-radius:12px;background:var(--text);color:#fff;font-weight:700;font-size:14px}

    .pinWrap{width:120px;display:flex;flex-direction:column;align-items:center;pointer-events:none}
    .pin{pointer-events:auto;position:relative;width:34px;height:34px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);background:#fff;border:2px solid var(--text);box-shadow:0 3px 8px rgba(0,0,0,.25);display:grid;place-items:center;transition:transform .15s}
    .pin>span{transform:rotate(45deg);font-size:16px;line-height:1}
    .pin.multi{border-color:var(--gold);background:#fff8e6}
    .pin .pinN{position:absolute;top:-7px;right:-7px;transform:rotate(45deg);min-width:17px;height:17px;border-radius:999px;background:var(--gold);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;border:2px solid #fff;padding:0 3px}
    .pinWrap.sel .pin{background:var(--accent);border-color:var(--accent);transform:rotate(-45deg) scale(1.22)}
    .pinWrap.sel .pin.multi .pinN{background:var(--text)}
    .pinLabel{pointer-events:auto;margin-top:6px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:700;color:var(--text);text-shadow:0 0 2px #fff,0 0 2px #fff,0 0 3px #fff,0 0 4px #fff}
    .pinWrap.sel .pinLabel{color:var(--accent-strong);font-size:13px}
    .cluster{border-radius:50%;background:rgba(23,25,28,.88);color:#fff;font-weight:800;display:grid;place-items:center;box-shadow:0 0 0 5px rgba(23,25,28,.16),0 3px 10px rgba(0,0,0,.2);font-size:13px}
    .cluster.hasMulti{background:rgba(255,90,31,.92);box-shadow:0 0 0 5px rgba(255,90,31,.2),0 3px 10px rgba(0,0,0,.2)}
    .meDot{width:18px;height:18px;border-radius:50%;background:#2f80ed;border:3px solid #fff;box-shadow:0 0 0 6px rgba(47,128,237,.22),0 1px 5px #0005}

    .peekCard{position:absolute;left:12px;right:12px;bottom:14px;z-index:14;background:#fff;border-radius:18px;box-shadow:var(--shadow-lg);padding:14px;display:flex;gap:12px;transform:translateY(130%);transition:transform .28s var(--ease);cursor:pointer;text-align:left}
    .peekCard.show{transform:none}
    .peekBody{flex:1;min-width:0}
    .peekClose{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
    .peekClose .ic{width:16px;height:16px}
    .peekMore{display:flex;align-items:center;gap:2px;font-size:12px;font-weight:700;color:var(--accent);margin-top:8px}
    .peekMore .ic{width:14px;height:14px}

    /* ---------- list ---------- */
    .listPane{overflow-y:auto;-webkit-overflow-scrolling:touch}
    .listHead{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line)}
    .listTitle{font-size:15px;font-weight:700}
    .listTitle span{color:var(--accent)}
    .seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px}
    .seg button{padding:6px 10px;border-radius:8px;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
    .seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
    .paneTabs{display:none}
    .cards{padding:0 16px}
    .card{display:flex;gap:12px;padding:16px 0;border-bottom:1px solid var(--line);cursor:pointer;width:100%;text-align:left}
    .card:last-child{border-bottom:0}
    .card.sel{background:linear-gradient(90deg,var(--accent-soft),transparent 70%)}
    .avatar{width:56px;height:56px;border-radius:16px;background:var(--surface-2);display:grid;place-items:center;font-size:27px;flex:none;position:relative}
    .avatar.multi:after{content:"★";position:absolute;right:-4px;bottom:-4px;width:20px;height:20px;border-radius:50%;background:var(--gold);color:#fff;font-size:11px;display:grid;place-items:center;border:2px solid #fff}
    .cardBody{flex:1;min-width:0}
    .cardTop{display:flex;align-items:flex-start;gap:8px}
    .cardName{flex:1;min-width:0;margin:0;font-size:16px;font-weight:700;letter-spacing:-.3px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .saveBtn{width:32px;height:32px;margin:-6px -6px 0 0;border-radius:50%;display:grid;place-items:center;color:#c3c7cc;flex:none}
    .saveBtn.on{color:var(--accent)}
    .saveBtn.on .ic{fill:currentColor}
    .meta{display:flex;align-items:center;flex-wrap:wrap;gap:0 6px;font-size:13px;color:var(--muted);margin-top:3px}
    .meta>*+*:before{content:"";display:inline-block;width:2px;height:2px;border-radius:50%;background:#b8bcc1;vertical-align:middle;margin-right:6px}
    .star{color:var(--text);font-weight:700;display:inline-flex;align-items:center;gap:2px}
    .star .ic{width:13px;height:13px;color:var(--star)}
    .star small{font-weight:600;color:var(--muted);font-size:11px;margin-left:2px}
    .dist{color:var(--text-2);font-weight:600}
    .badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
    .sb{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:4px 7px 4px 6px;border-radius:6px;background:color-mix(in srgb,var(--c) 11%,#fff);color:color-mix(in srgb,var(--c) 85%,#000)}
    .sb:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
    .menuLine{font-size:13px;color:var(--text-2);margin-top:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .menuLine em{font-style:normal;color:var(--muted);margin-right:4px}

    .empty{padding:56px 24px;text-align:center;color:var(--muted);font-size:14px;line-height:1.6}
    .empty .big{font-size:40px;margin-bottom:8px}
    .empty b{display:block;color:var(--text);font-size:16px;margin-bottom:4px}
    .empty button{margin-top:14px;padding:10px 16px;border-radius:12px;background:var(--text);color:#fff;font-weight:700;font-size:14px}

    .cand{margin:20px 16px 0;border-radius:16px;background:var(--surface-2);overflow:hidden}
    .cand summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:700}
    .cand summary::-webkit-details-marker{display:none}
    .cand summary small{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-top:2px}
    .cand summary .ic{color:var(--muted);transition:transform .2s}
    .cand[open] summary .ic{transform:rotate(90deg)}
    .candRow{padding:12px 16px;border-top:1px solid var(--line);font-size:14px}
    .candRow b{font-weight:700}
    .candRow .meta{font-size:12px}
    .listFoot{padding:22px 16px calc(28px + env(safe-area-inset-bottom));font-size:12px;color:var(--muted);line-height:1.6}

    /* ---------- bottom nav ---------- */
    .bottom{flex:none;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:50}
    .bottom button{flex:1;height:var(--nav-h);color:#a2a7ad;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;position:relative}
    .bottom button.on{color:var(--text)}
    .bottom .ic{width:22px;height:22px}
    .bottom .navN{position:absolute;top:8px;left:calc(50% + 7px);min-width:16px;height:16px;border-radius:999px;background:var(--accent);color:#fff;font-size:10px;display:none;place-items:center;padding:0 4px}
    .bottom .navN.show{display:grid}

    /* ---------- sheets ---------- */
    .scrim{position:fixed;inset:0;background:rgba(17,20,24,.4);z-index:80;opacity:0;pointer-events:none;transition:opacity .25s}
    .scrim.show{opacity:1;pointer-events:auto}
    .sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;width:100%;max-width:560px;background:#fff;border-radius:22px 22px 0 0;box-shadow:var(--shadow-lg);transform:translateY(105%);transition:transform .3s var(--ease);display:flex;flex-direction:column;visibility:hidden}
    .sheet.show{transform:none;visibility:visible}
    .sheet.dragging{transition:none}
    .grab{flex:none;padding:8px 0 4px;touch-action:none;cursor:grab}
    .grab:before{content:"";display:block;width:38px;height:4px;border-radius:999px;background:#d6d9dd;margin:0 auto}

    .detail{z-index:85;height:min(88dvh,820px)}
    .dScroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
    .dTop{position:sticky;top:0;z-index:2;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:4px 10px 4px 16px}
    .dTop .dMini{font-size:15px;font-weight:700;opacity:0;transition:opacity .15s;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
    .dTop.stuck{border-bottom:1px solid var(--line)}
    .dTop.stuck .dMini{opacity:1}
    .iconBtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--text-2);flex:none}
    .iconBtn:hover{background:var(--surface-2)}
    .dHero{padding:2px 20px 0;display:flex;gap:14px;align-items:flex-start}
    .dHero .avatar{width:64px;height:64px;font-size:32px;border-radius:18px}
    .dName{margin:0;font-size:22px;font-weight:800;letter-spacing:-.5px;line-height:1.3}
    .dHero .meta{margin-top:4px}
    .dActions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:18px 20px 6px}
    .act{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 0 10px;border-radius:14px;background:var(--surface-2);font-size:12px;font-weight:700;color:var(--text-2)}
    .act .ic{width:21px;height:21px;color:var(--text)}
    .act.on .ic{color:var(--accent);fill:var(--accent)}
    .act.primary{background:var(--accent);color:#fff}
    .act.primary .ic{color:#fff}
    .dSec{padding:20px 20px 4px}
    .dSec+.dSec{border-top:8px solid var(--surface-2);margin-top:14px}
    .dSecT{display:flex;align-items:center;justify-content:space-between;font-size:16px;font-weight:800;margin-bottom:12px;letter-spacing:-.3px}
    .dSecT small{font-size:12px;color:var(--muted);font-weight:600}
    .rates{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .rate{border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:block}
    .rate .pf{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--text-2)}
    .pfDot{width:16px;height:16px;border-radius:4px;display:grid;place-items:center;font-size:10px;font-weight:900}
    .pfDot.n{background:var(--naver);color:#fff}
    .pfDot.k{background:var(--kakao);color:#3a1d1d}
    .rate .v{font-size:22px;font-weight:800;margin-top:6px;display:flex;align-items:center;gap:4px;letter-spacing:-.4px}
    .rate .v .ic{width:18px;height:18px;color:var(--star)}
    .rate .v.na{font-size:15px;color:var(--muted);font-weight:700;height:33px}
    .rate .rc{font-size:12px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:2px}
    .rate .rc .ic{width:12px;height:12px}
    .rate.good{border-color:color-mix(in srgb,var(--accent) 35%,#fff);background:color-mix(in srgb,var(--accent) 4%,#fff)}
    .srcList{display:flex;flex-direction:column;gap:8px}
    .src{border-radius:14px;background:var(--surface-2);padding:12px 14px;display:flex;align-items:center;gap:12px}
    .srcMark{width:36px;height:36px;border-radius:10px;background:var(--c);color:#fff;font-size:13px;font-weight:800;display:grid;place-items:center;flex:none}
    .srcBody{flex:1;min-width:0}
    .srcBody b{display:block;font-size:14px;font-weight:700}
    .srcBody small{display:block;font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4}
    .srcLinks{display:flex;gap:6px;flex:none}
    .pill{display:inline-flex;align-items:center;gap:4px;height:30px;padding:0 10px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--text-2);white-space:nowrap}
    .pill .ic{width:13px;height:13px}
    .pill.yt{background:#ff0000;border-color:#ff0000;color:#fff}
    .menus{display:flex;flex-wrap:wrap;gap:6px}
    .menuChip{padding:8px 12px;border-radius:10px;background:var(--surface-2);font-size:14px;font-weight:600}
    .note{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.5}
    .addr{display:flex;gap:10px;align-items:flex-start}
    .addr .ic{color:var(--muted);margin-top:1px}
    .addrText{flex:1;min-width:0;font-size:14px;line-height:1.5}
    .addrText small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
    .addrBtns{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
    .facts{margin-top:4px;border-radius:14px;background:var(--surface-2);padding:4px 14px;font-size:12px;color:var(--text-2)}
    .facts summary{list-style:none;cursor:pointer;padding:10px 0;font-weight:700;display:flex;align-items:center;justify-content:space-between}
    .facts summary::-webkit-details-marker{display:none}
    .facts summary .ic{width:16px;height:16px;transition:transform .2s;color:var(--muted)}
    .facts[open] summary .ic{transform:rotate(90deg)}
    .facts ul{margin:0 0 12px;padding-left:16px;line-height:1.7}
    .facts a{text-decoration:underline;color:var(--text-2)}

    .filter{z-index:95;max-height:88dvh}
    .fHead{display:flex;align-items:center;justify-content:space-between;padding:4px 10px 10px 20px;border-bottom:1px solid var(--line)}
    .fHead h2{margin:0;font-size:19px;font-weight:800}
    .fBody{overflow:auto;padding:0 20px 10px}
    .fSec{padding:18px 0;border-bottom:1px solid var(--line)}
    .fSec:last-child{border-bottom:0}
    .fT{font-size:15px;font-weight:800;margin-bottom:4px}
    .fSub{font-size:12px;color:var(--muted);margin-bottom:12px}
    .opts{display:flex;flex-wrap:wrap;gap:8px}
    .opt{height:38px;padding:0 13px;border:1px solid var(--line);border-radius:999px;font-size:14px;font-weight:600;color:var(--text-2);display:inline-flex;align-items:center;gap:6px}
    .opt .n{font-size:12px;color:var(--muted);font-weight:600}
    .opt.on{border-color:var(--text);background:var(--text);color:#fff}
    .opt.on .n{color:#ffffffa8}
    .opt:disabled{opacity:.4;cursor:default}
    .opt .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
    .toggleRow{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left}
    .toggleRow b{display:block;font-size:15px;font-weight:800}
    .toggleRow span{font-size:12px;color:var(--muted)}
    .switch{width:50px;height:30px;border-radius:999px;background:#d9dce0;position:relative;transition:background .2s;flex:none}
    .switch:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 4px #0003;transition:left .2s var(--ease)}
    .switch.on{background:var(--accent)}
    .switch.on:after{left:23px}
    .fFoot{display:flex;gap:8px;padding:12px 20px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
    .fReset{height:52px;padding:0 16px;border-radius:14px;background:var(--surface-2);font-weight:700;display:flex;align-items:center;gap:6px;color:var(--text-2)}
    .fReset .ic{width:16px;height:16px}
    .fApply{flex:1;height:52px;border-radius:14px;background:var(--accent);color:#fff;font-weight:800;font-size:16px}
    .fApply:disabled{background:#c9ccd1}

    .toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:rgba(23,25,28,.94);color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:120;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s var(--ease);max-width:calc(100% - 32px);text-align:center}
    .toast.show{opacity:1;transform:translate(-50%,0)}

    /* ---------- desktop: list + map split ---------- */
    @media (min-width:900px){
      .top{padding:12px 20px 0;display:grid;grid-template-columns:var(--panel-w) 1fr;column-gap:20px;align-items:center}
      .brandRow{margin:0}
      .searchRow{grid-column:2;max-width:560px}
      .catBar{grid-column:1 / -1;margin:0 -20px;padding:10px 20px}
      .main{display:grid;grid-template-columns:var(--panel-w) 1fr}
      .pane{position:relative;inset:auto}
      .listPane,.savedPane{grid-column:1;grid-row:1;border-right:1px solid var(--line)}
      .mapPane{display:block;grid-column:2;grid-row:1}
      .paneTabs{display:flex;gap:4px;padding:12px 16px 0;position:sticky;top:0;background:#fff;z-index:6}
      .paneTabs button{flex:1;height:38px;border-radius:10px;font-weight:700;font-size:14px;color:var(--muted);background:var(--surface-2)}
      .paneTabs button.on{background:var(--text);color:#fff}
      .listHead{top:50px}
      .bottom{display:none}
      .listFab{display:none}
      .peekCard{left:auto;right:16px;width:360px;bottom:16px}
      .mapPane.peek .locBtn{bottom:18px;right:390px}
      .main.detailOpen .peekCard{transform:translateY(130%)}
      .main.detailOpen .mapPane.peek .locBtn{right:14px}
      .detail{position:absolute;left:0;top:0;bottom:0;right:auto;margin:0;width:var(--panel-w);max-width:none;height:auto;border-radius:0;box-shadow:6px 0 24px rgba(0,0,0,.08);transform:translateX(-105%);z-index:30}
      .detail .grab{display:none}
      .detail.show{transform:none}
      .scrim.forDetail{display:none}
      .filter{top:50%;bottom:auto;left:50%;right:auto;width:460px;border-radius:22px;transform:translate(-50%,-46%);opacity:0;transition:transform .25s var(--ease),opacity .2s}
      .filter.show{transform:translate(-50%,-50%);opacity:1}
      .filter .grab{display:none}
      .fHead{padding-top:16px}
      .toast{bottom:28px}
    }
    @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  </style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brandRow">
      <div class="brand"><span class="logo" aria-hidden="true">맛</span>인증맛집</div>
      <div class="brandSub" id="brandSub"></div>
    </div>
    <div class="searchRow">
      <div class="searchBox" id="searchBox">
        <svg class="ic" viewBox="0 0 24 24"><use href="#i-search"/></svg>
        <label for="q" class="sr">맛집 검색</label>
        <input id="q" class="search" type="search" autocomplete="off" enterkeyhint="search" placeholder="가게, 메뉴, 지역 검색" aria-controls="suggest" aria-expanded="false">
        <button class="clearQ" id="clearQ" aria-label="검색어 지우기"><svg class="ic" viewBox="0 0 24 24"><use href="#i-x"/></svg></button>

      <button id="filterBtn" class="filterBtn" aria-label="필터"><svg class="ic" viewBox="0 0 24 24"><use href="#i-sliders"/></svg><span id="filterBadge" class="badge">0</span></button>
      <div id="suggest" class="suggest" role="listbox" aria-label="검색 제안"></div>

  </header>

  <main class="main" id="main">

      <div id="cards" class="cards"></div>
      <details id="cand" class="cand"></details>
      <div class="listFoot">방송·유튜브에 소개된 실제 지점 중 네이버 또는 카카오 평점이 4.0 이상인 곳만 담았어요. 평점은 공개 집계 자료 기준이며 실시간 값이 아닐 수 있어요.</div>
    </section>

    <section id="savedPane" class="pane listPane savedPane" aria-label="저장한 맛집">
      <div class="paneTabs"><button data-view="list">전체 맛집</button><button data-view="saved" class="on">저장한 맛집 <span class="savedN"></span></button></div>
      <div class="listHead"><div class="listTitle" id="savedTitle"></div></div>
      <div id="savedCards" class="cards"></div>
    </section>

    <section id="mapPane" class="pane mapPane show" aria-label="지도">
      <div id="map"></div>
      <button id="listFab" class="fab listFab"><svg class="ic" viewBox="0 0 24 24"><use href="#i-list"/></svg><span>이 지역 <b id="inView">0</b>곳 목록보기</span></button>
      <button id="locBtn" class="fab locBtn" aria-label="내 위치로 이동"><svg class="ic" viewBox="0 0 24 24"><use href="#i-locate"/></svg></button>
      <div id="peek" class="peekCard" role="button" tabindex="0" aria-label="맛집 상세 열기"></div>
      <div id="mapError" class="mapError"><div><b>지도를 불러오지 못했어요</b>네트워크 상태를 확인하거나 잠시 후 다시 시도해 주세요.<br>목록에서는 계속 맛집을 볼 수 있어요.<br><button id="errToList">목록으로 보기</button></div></div>
    </section>

    <div id="detailScrim" class="scrim forDetail"></div>
    <section id="detail" class="sheet detail" role="dialog" aria-modal="true" aria-labelledby="dName" aria-hidden="true">
      <div class="grab" id="detailGrab"></div>
      <div class="dScroll" id="dScroll"></div>
    </section>
  </main>

  <nav class="bottom" aria-label="화면 전환">
    <button data-view="map" class="on"><svg class="ic" viewBox="0 0 24 24"><use href="#i-map"/></svg>지도</button>
    <button data-view="list"><svg class="ic" viewBox="0 0 24 24"><use href="#i-list"/></svg>목록</button>
    <button data-view="saved"><svg class="ic" viewBox="0 0 24 24"><use href="#i-heart"/></svg>저장<span class="navN savedN"></span></button>
  </nav>
</div>

<div id="filterScrim" class="scrim"></div>
<section id="filter" class="sheet filter" role="dialog" aria-modal="true" aria-labelledby="fTitle" aria-hidden="true">
  <div class="grab" id="filterGrab"></div>
  <div class="fHead"><h2 id="fTitle">필터</h2><button class="iconBtn" id="filterClose" aria-label="닫기"><svg class="ic" viewBox="0 0 24 24"><use href="#i-x"/></svg></button></div>
  <div class="fBody">
    <section class="fSec">
      <div class="fT">인증 콘텐츠</div>
      <div class="fSub">하나라도 해당하면 보여줘요</div>
      <div id="fSources" class="opts"></div>
    </section>
    <section class="fSec">
      <div class="fT">지역</div>
      <div class="fSub">여러 지역을 함께 고를 수 있어요</div>
      <div id="fRegions" class="opts"></div>
    </section>
    <section class="fSec">
      <div class="fT">평점</div>
      <div class="fSub">네이버·카카오 중 높은 점수 기준</div>
      <div id="fRating" class="opts"></div>
    </section>
    <section class="fSec">
      <button class="toggleRow" id="fMulti" role="switch" aria-checked="false">
        <div><b>복수 인증 맛집만</b><span>2개 이상의 방송·채널이 소개한 곳</span></div>
        <div class="switch"></div>

    </section>
  </div>
  <div class="fFoot">
    <button class="fReset" id="fReset"><svg class="ic" viewBox="0 0 24 24"><use href="#i-refresh"/></svg>초기화</button>
    <button class="fApply" id="fApply"></button>

</section>

  function totalReviews(r){ return (reviews(r,"naver") || 0) + (reviews(r,"kakao") || 0); }
  function fmtN(n){ return n >= 10000 ? (n/10000).toFixed(1).replace(/\.0$/,"") + "만" : n.toLocaleString("ko-KR"); }
  function distKm(r){
    if(!me) return null;
    var toRad = Math.PI/180, dLat = (r.lat-me.lat)*toRad, dLng = (r.lng-me.lng)*toRad;
    var a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(me.lat*toRad)*Math.cos(r.lat*toRad)*Math.sin(dLng/2)*Math.sin(dLng/2);

  function score(r){ return (r.sources.length - 1) * 0.35 + best(r) + Math.min(0.25, Math.log10(1 + totalReviews(r)) * 0.06); }
  function isSaved(id){ return saved.indexOf(id) >= 0; }
  function hasMap(){ return !!(map && window.naver && naver.maps); }
  var toastT;

  /* ---------- filtering ---------- */
  function term(){ return $("q").value.trim().toLowerCase(); }
  function matchText(r, t){
    if(!t) return true;
    var hay = [r.name, r.region, REGION_SHORT[r.region], r.district, r.address, r.address_jibun, r.raw_category, (r.cats || []).join(" "), (r.sources || []).join(" ")]
      .concat((r.menu || []).map(function(m){ return m[0]; })).join(" ").toLowerCase();
    return t.split(/\s+/).every(function(w){ return hay.indexOf(w) >= 0; });
  }
  function matches(r, f, opt){
    opt = opt || {};
    if(!opt.ignoreCat && cat !== "all" && (r.cats || []).indexOf(cat) < 0) return false;
    if(f.sources.length && !f.sources.some(function(s){ return r.sources.indexOf(s) >= 0; })) return false;
    if(f.regions.length && f.regions.indexOf(r.region) < 0) return false;
    if(f.minRating && best(r) < f.minRating) return false;
    if(f.multi && !isMulti(r)) return false;
    if(!matchText(r, term())) return false;
    if(opt.bounds && boundsOnly && hasMap() && !map.getBounds().hasLatLng(new naver.maps.LatLng(r.lat, r.lng))) return false;
    return true;
  }
  function results(opt){ return R.filter(function(r){ return matches(r, applied, opt); }); }

    var by = sortBy === "dist" && !me ? "rec" : sortBy;
    return rows.slice().sort(function(a,b){
      if(by === "dist") return distKm(a) - distKm(b);
      if(by === "rating") return best(b) - best(a) || totalReviews(b) - totalReviews(a);

      rows.map(function(x){

  /* ---------- map ---------- */
  function pinHtml(r, withLabel){
    var multi = isMulti(r);
    return '<div class="pinWrap' + (selectedId === r.id ? " sel" : "") + '"><div class="pin' + (multi ? " multi" : "") + '"><span>' + emoji(r) + '</span>' +
      (multi ? '<b class="pinN">' + r.sources.length + '</b>' : '') + '</div>' +
      (withLabel ? '<div class="pinLabel">' + esc(r.name) + '</div>' : '') + '</div>';
  }
  function clusterize(rows){
    var zoom = map.getZoom();
    if(zoom >= CLUSTER_UNTIL_ZOOM) return rows.map(function(r){ return [r]; });
    var proj = map.getProjection(), groups = [], R2 = 52*52;
    rows.slice().sort(function(a,b){ return score(b) - score(a); }).forEach(function(r){
      var p = proj.fromCoordToOffset(new naver.maps.LatLng(r.lat, r.lng));
      for(var i = 0; i < groups.length; i++){
        var g = groups[i], dx = g.x - p.x, dy = g.y - p.y;
        if(dx*dx + dy*dy < R2){ g.items.push(r); return; }
      }
      groups.push({x:p.x, y:p.y, items:[r]});
    });
    return groups.map(function(g){ return g.items; });
  }
  function drawMarkers(){
    if(!hasMap()) return;
    mapMarkers.forEach(function(m){ m.setMap(null); });
    mapMarkers = [];
    var rows = results(), zoom = map.getZoom(), bounds = map.getBounds();
    var inView = rows.filter(function(r){ return bounds.hasLatLng(new naver.maps.LatLng(r.lat, r.lng)); }).length;
    $("inView").textContent = inView;
    var clusters = clusterize(rows);
    clusters.forEach(function(items){
      var marker;
      if(items.length === 1){
        var r = items[0];
        marker = new naver.maps.Marker({
          position:new naver.maps.LatLng(r.lat, r.lng), map:map, title:r.name,
          zIndex: selectedId === r.id ? 1000 : (isMulti(r) ? 200 : 100),
          icon:{content:pinHtml(r, zoom >= LABEL_FROM_ZOOM || selectedId === r.id), anchor:new naver.maps.Point(60, 44)}
        });
        naver.maps.Event.addListener(marker, "click", function(){ select(r.id, {pan:false}); });
      }else{
        var lat = 0, lng = 0, multi = false;
        items.forEach(function(r){ lat += r.lat; lng += r.lng; multi = multi || isMulti(r); });
        var size = items.length < 10 ? 38 : items.length < 30 ? 46 : 54;
        marker = new naver.maps.Marker({
          position:new naver.maps.LatLng(lat/items.length, lng/items.length), map:map, zIndex:50,
          icon:{content:'<div class="cluster' + (multi ? " hasMulti" : "") + '" style="width:' + size + 'px;height:' + size + 'px">' + items.length + '</div>', anchor:new naver.maps.Point(size/2, size/2)}
        });
        naver.maps.Event.addListener(marker, "click", function(){ fitTo(items); });
      }
      mapMarkers.push(marker);
    });
    if(selectedId != null && !rows.some(function(r){ return r.id === selectedId; })) clearSelection();
    // keep the selected place visible as a single pin even when it would be clustered
    var sel = BY_ID[selectedId];
    var selClustered = sel && clusters.some(function(items){ return items.length > 1 && items.indexOf(sel) >= 0; });
    if(selClustered){
      var sm = new naver.maps.Marker({position:new naver.maps.LatLng(sel.lat, sel.lng), map:map, zIndex:1000, icon:{content:pinHtml(sel, true), anchor:new naver.maps.Point(60, 44)}});
      naver.maps.Event.addListener(sm, "click", function(){ openDetail(sel.id); });
      mapMarkers.push(sm);
    }
  }
  var pendingFit = null;
  function mapVisible(){ return $("mapPane").offsetWidth > 0; }
  function fitTo(rows){
    if(!hasMap() || !rows.length) return;
    if(!mapVisible()){ pendingFit = rows; return; }
    pendingFit = null;

    if(rows.length === 1){ map.morph(new naver.maps.LatLng(rows[0].lat, rows[0].lng), 16); return; }
    var b = new naver.maps.LatLngBounds(new naver.maps.LatLng(rows[0].lat, rows[0].lng), new naver.maps.LatLng(rows[0].lat, rows[0].lng));
    rows.forEach(function(r){ b.extend(new naver.maps.LatLng(r.lat, r.lng)); });
    map.fitBounds(b, {top:60, right:40, bottom:90, left:40});
  }
  function select(id, opt){
    opt = opt || {};

      var p = proj.fromCoordToOffset(new naver.maps.LatLng(r.lat, r.lng)), c = proj.fromCoordToOffset(map.getCenter());

  /* ---------- location ---------- */
  function locate(opt){
    opt = opt || {};

    btn.classList.add("busy");
    navigator.geolocation.getCurrentPosition(function(pos){
      btn.classList.remove("busy"); btn.classList.add("on");
      me = {lat:pos.coords.latitude, lng:pos.coords.longitude};
      if(hasMap()){
        var here = new naver.maps.LatLng(me.lat, me.lng);
        if(meMarker) meMarker.setMap(null);
        meMarker = new naver.maps.Marker({position:here, map:map, zIndex:2000, clickable:false, icon:{content:'<div class="meDot"></div>', anchor:new naver.maps.Point(9, 9)}});

  /* ---------- detail ---------- */
  function rateTile(r, pf){
    var v = r[pf], n = reviews(r, pf), url = safeUrl(r[pf + "_url"]);
    var name = pf === "naver" ? "네이버" : "카카오";
    var inner = '<div class="pf"><span class="pfDot ' + pf.charAt(0) + '">' + (pf === "naver" ? "N" : "K") + '</span>' + name + '</div>' +
      (isNum(v) ? '<div class="v">' + ic("star","fill") + v.toFixed(2).replace(/0$/,"") + '</div>' : '<div class="v na">평점 미확인</div>') +
      '<div class="rc">' + (n != null ? "리뷰 " + fmtN(n) + "개" : "&nbsp;") + (url ? " " + ic("chev") : "") + '</div>';
    var cls = "rate" + (isNum(v) && v >= 4 ? " good" : "");
    return url ? '<a class="' + cls + '" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer" aria-label="' + name + '에서 리뷰 보기">' + inner + '</a>' : '<div class="' + cls + '">' + inner + '</div>';
  }
  function sourceRows(r){
    return r.sources.map(function(s){
      var ev = (r.source_evidence || []).filter(function(e){ return e.source === s; });

})();
